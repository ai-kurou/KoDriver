name: Setup build environment
description: Configure Java and Gradle

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 17

    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # Voskモデルのzip(prepareVoskModelの取得結果)も保存し、毎回の再ダウンロードを避ける
        gradle-home-cache-includes: |
          caches
          notifications
          kodriver-vosk-model

    # 公開リポジトリの標準ランナー（4 vCPU / 16 GB）に合わせ、CI だけ Gradle のヒープとワーカー数を上書きする。
    # ローカル向けの gradle.properties（ヒープ2GB・workers.max=2）は変更せず、GRADLE_USER_HOME の
    # gradle.properties はプロジェクトの gradle.properties より優先される。
    # ヒープを16GBいっぱいにしないのは、テストJVM・OS・ネイティブ領域の分を残すため。
    - name: Configure Gradle for CI runners
      shell: bash
      run: |
        gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$gradle_home"
        {
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
          echo "org.gradle.workers.max=4"
        } >> "$gradle_home/gradle.properties"
