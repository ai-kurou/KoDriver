name: CodeQL Analyze
description: Java/Kotlin の CodeQL 解析を実行する

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup

    - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: java-kotlin

    - run: ./gradlew --no-build-cache --rerun-tasks :app:androidApp:assembleDebug
      shell: bash

    - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
