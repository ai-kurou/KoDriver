name: CodeQL Analyze
description: Java/Kotlin の CodeQL 解析を実行する

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup

    - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: java-kotlin

    # 解析中にランナーが強制停止される事象（"The runner has received a shutdown signal"）への対策。
    # CodeQL の評価・結果解釈とメモリを取り合わないよう、ビルド中の Gradle ヒープ・ワーカー数を抑える。
    - name: Build for CodeQL
      shell: bash
      run: |
        free -m
        ./gradlew --no-build-cache --rerun-tasks --max-workers=2 \
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
          :app:androidApp:assembleDebug

    # ビルド後に Gradle / Kotlin デーモンを停止し、解析フェーズにメモリを明け渡す。
    - name: Stop Gradle and Kotlin daemons
      shell: bash
      run: |
        ./gradlew --stop
        pkill -f KotlinCompileDaemon || true
        free -m

    - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
