name: Record Golden Images

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  record-desktop:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'record-golden-images'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: ./.github/actions/setup-screenshot

      - name: Record JVM golden images
        run: ./gradlew recordRoborazziJvmTests

      - name: Upload JVM snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-snapshots
          path: "**/jvmTest/snapshots/*.png"
          if-no-files-found: ignore

  record-android:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'record-golden-images'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: ./.github/actions/setup-screenshot

      - name: Record Android golden images
        run: ./gradlew recordRoborazziAndroidHostTests

      - name: Upload Android snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-snapshots
          path: "**/androidHostTest/snapshots/*.png"
          if-no-files-found: ignore

  commit:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'record-golden-images'
    needs: [record-desktop, record-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Download JVM snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jvm-snapshots

      - name: Download Android snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-snapshots

      - name: Commit updated golden images
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . \( -path "*/jvmTest/snapshots/*.png" -o -path "*/androidHostTest/snapshots/*.png" \) \
            -not -path "*/build/*" -print0 | xargs -0 -r git add
          git diff --staged --quiet || git commit -m "chore: update golden images"
          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"
