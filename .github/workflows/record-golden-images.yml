name: Record Golden Images

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  record-desktop:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'record-golden-images'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: ./.github/actions/setup-screenshot

      - name: Record JVM golden images
        # record タスク自体が失敗（コンパイルエラー等）しても、正常に記録できたモジュール分の
        # golden 画像だけはアップロード・コミットできるようにする。
        continue-on-error: true
        run: ./gradlew recordRoborazziJvmTests --continue

      - name: Upload JVM snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-snapshots
          path: "**/jvmTest/snapshots/*.png"
          if-no-files-found: ignore

  record-android:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'record-golden-images'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: ./.github/actions/setup-screenshot

      - name: Record Android golden images
        # record タスク自体が失敗（コンパイルエラー等）しても、正常に記録できたモジュール分の
        # golden 画像だけはアップロード・コミットできるようにする。
        continue-on-error: true
        run: ./gradlew recordRoborazziAndroidHostTests --continue

      - name: Upload Android snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-snapshots
          path: "**/androidHostTest/snapshots/*.png"
          if-no-files-found: ignore

  commit:
    # record-desktop / record-android のいずれかが失敗しても、正常に記録できたモジュール分の
    # golden 画像だけはコミットできるようにする。
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'record-golden-images')
    needs: [record-desktop, record-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Download JVM snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jvm-snapshots

      - name: Download Android snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-snapshots

      - name: Commit updated golden images
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . \( -path "*/jvmTest/snapshots/*.png" -o -path "*/androidHostTest/snapshots/*.png" \) \
            -not -path "*/build/*" -print0 | xargs -0 -r git add
          git diff --staged --quiet || git commit -m "chore: update golden images"
          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"
