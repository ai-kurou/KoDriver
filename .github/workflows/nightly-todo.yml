name: Nightly TODO

on:
  schedule:
    - cron: "3 19 * * *" # JST 4:03 (UTC 19:03)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly-todo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache global npm directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-claude-code-2.1.226

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Determine JST date and weekday
        id: jst
        run: |
          echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "weekday=$(TZ=Asia/Tokyo date +%A)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to file improvement issues
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JST_DATE: ${{ steps.jst.outputs.date }}
          JST_WEEKDAY: ${{ steps.jst.outputs.weekday }}
        run: |
          claude -p "$(cat <<PROMPT
          KoDriverリポジトリの深夜バッチ処理を行ってください。今日の日付は ${JST_DATE}（JSTの曜日: ${JST_WEEKDAY}）です。

          1. docs/nightly-todo-list.md を読み、「毎晩実行する項目」と、上記のJST曜日に対応する「曜日ローテーション項目」だけを対象にする（他の曜日の項目は対象外）。
          2. 対象項目それぞれについて調査し、KoDriverにIssueとして起票する価値があると判断した改善案をまとめる。
          3. 改善案がある場合は、`gh issue list --search "<キーワード>"`（オープン・クローズ問わず）で同趣旨のIssueが既に存在しないか確認する。既存Issueがあれば、その改善案は起票しない。
          4. 重複がなければ `gh issue create --title "<タイトル>" --body "<本文>"` でIssueを起票する。ラベルは付けない。タイトルは対象がわかる簡潔なもの、本文は「対象・課題・改善案」がわかる粒度で書く（既存Issueの書式を `gh issue list` 等で確認し、それに合わせる）。同一バッチ内で重複するIssueを複数起票しない。
          5. リポジトリ内のファイルは一切変更しない（`gh issue create` によるIssue起票のみを行う）。起票する改善案が1件もない場合は何も起票しない。
          6. 最後に、調査した各項目について「確認した内容」「起票した/しなかった判断とその理由（起票した場合はIssue番号）」を簡潔にまとめて出力する（このまとめはワークフローのジョブサマリーに転記される）。ZennとQiitaについては、docs/nightly-todo-list.md の当該項目の指示に従い、過去24時間以内に確認した全記事のURLと1行要約の一覧も出力に含めること。
          PROMPT
          )" \
            --allowedTools "Read,Grep,Glob,WebSearch,WebFetch,Bash(gh issue list:*),Bash(gh issue create:*)" \
            --permission-mode acceptEdits \
            --model sonnet \
            --effort low \
            | tee nightly-todo-summary.txt

      - name: Verify no repository files changed
        run: |
          changed_files="$(git status --porcelain -- . ':!nightly-todo-summary.txt' | awk '{print $2}')"
          if [ -n "$changed_files" ]; then
            echo "::error::Unexpected files changed by Claude Code: $changed_files"
            git checkout -- .
            exit 1
          fi

      - name: Publish job summary
        run: |
          {
            echo "夜間バッチ（nightly-todo.yml）が docs/nightly-todo-list.md を調査し、改善案をGitHub Issueとして起票しました。"
            echo
            echo "## 実行ログの要約"
            echo
            cat nightly-todo-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"
