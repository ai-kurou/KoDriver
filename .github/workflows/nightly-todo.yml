name: Nightly TODO

on:
  schedule:
    - cron: "3 19 * * *" # JST 4:03 (UTC 19:03)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly-todo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Cache global npm directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-claude-code-2.1.226

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Determine JST date and weekday
        id: jst
        run: |
          echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "weekday=$(TZ=Asia/Tokyo date +%A)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to file improvement issues
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JST_DATE: ${{ steps.jst.outputs.date }}
          JST_WEEKDAY: ${{ steps.jst.outputs.weekday }}
        run: |
          python3 scripts/nightly_todo.py \
            --date "$JST_DATE" --weekday "$JST_WEEKDAY" \
            --output-dir "$RUNNER_TEMP/nightly-todo"

      - name: Verify no repository files changed
        if: always()
        run: |
          changed_files="$(git status --porcelain | awk '{print $2}')"
          if [ -n "$changed_files" ]; then
            echo "::error::Unexpected files changed by Claude Code: $changed_files"
            git checkout -- .
            exit 1
          fi

      - name: Publish job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nightly-todo/summary.md" ]; then
            cat "$RUNNER_TEMP/nightly-todo/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "夜間調査: 未完了。調査開始前に失敗した可能性があります。各ステップのログを確認してください。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload nightly diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-todo-diagnostics
          path: ${{ runner.temp }}/nightly-todo/
          if-no-files-found: warn
          retention-days: 7
