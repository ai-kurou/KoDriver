name: Nightly TODO

on:
  schedule:
    - cron: "3 19 * * *" # JST 4:03 (UTC 19:03)
  workflow_dispatch:

concurrency:
  group: nightly-todo
  queue: max

permissions:
  contents: read
  issues: write

jobs:
  nightly-todo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Cache global npm directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-claude-code-2.1.226

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Determine JST date and weekday
        id: jst
        run: |
          echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "weekday=$(TZ=Asia/Tokyo date +%A)" >> "$GITHUB_OUTPUT"

      - name: Set up build environment for weekday analysis
        if: steps.jst.outputs.weekday == 'Tuesday' || steps.jst.outputs.weekday == 'Wednesday'
        uses: ./.github/actions/setup

      - name: Generate Kover report for Tuesday coverage check
        if: steps.jst.outputs.weekday == 'Tuesday'
        run: ./gradlew koverXmlReport --console=plain

      - name: Run Claude Code to investigate improvement candidates
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JST_DATE: ${{ steps.jst.outputs.date }}
          JST_WEEKDAY: ${{ steps.jst.outputs.weekday }}
        run: |
          diagnostics="$RUNNER_TEMP/nightly-todo"
          mkdir -p "$diagnostics"
          printf '# 夜間調査: 未完了\n\n実行中、または結果を取得できませんでした。\n' > "$diagnostics/summary.md"
          allowed_tools="Read,Grep,Glob,WebSearch,WebFetch,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh run list:*),Bash(gh api repos/*/actions/runs*)"
          case "$JST_WEEKDAY" in
            Wednesday) allowed_tools+=",Bash(./gradlew detekt:*),Bash(./gradlew ktlintCheck:*)" ;;
            Thursday) allowed_tools+=",Bash(gh api repos/*/security-advisories*)" ;;
          esac
          prompt="$(cat <<PROMPT
          KoDriverの夜間調査を行ってください。日付: ${JST_DATE}、JST曜日: ${JST_WEEKDAY}。
          docs/nightly-todo-list.mdを読み、毎晩実行する全項目と当日の曜日ローテーション項目だけを調査してください。
          ページ送り・日時判定・いいね数など、同ドキュメントの共通ルールも遵守してください。
          火曜のカバレッジ確認では、事前に生成済みの build/reports/kover/report.xml をRead・Grepで確認してください（Gradleは実行しません）。水曜の静的解析では ./gradlew detekt と ./gradlew ktlintCheck を別々に実行してください。
          ライブラリの最新安定版は、search.maven.orgのAPIではなく、各ライブラリのGitHub Releasesや公式リリースページで確認してください。
          Gradleの通常のビルド成果物・レポート生成は許可されていますが、ソースや設定の変更・自動整形は行いません。
          Gradleコマンドは run_in_background を使わずフォアグラウンドで実行し、Bashのtimeoutには上限の600000を指定してください。
          MonitorやoutputファイルのcatによるポーリングはdontAsk環境で拒否されるため行わないでください。
          Bashは許可されたghコマンドとGradleコマンドだけを使い、find・xargs・ls・cat・tail等やパイプ・リダイレクトは使いません。
          ファイルの探索・閲覧にはGlob・Grep・Readを使ってください。Gradleコマンドは指定どおり実行し、出力の加工（パイプ）はせず、必要なら--console=plainのみ付けてください。
          改善案は対象コードを読んで適用可能性を確認し、gh issue list --state all --searchで重複を確認します。必要ならgh issue viewで本文を確認してください。
          Issueは起票しないでください。重複のない各改善案を、構造化出力の issues 配列に1件ずつ、title（日本語の簡潔なタイトル）と body（Markdown、対象・課題・改善案が後から読んで分かる粒度）として返してください。title と body にはバックスラッシュ・バッククォート・ドル記号を使わないでください。ラベルは付けません。起票自体はワークフローが行います。
          このバッチはユーザーが承認したIssue起票の自動処理です。起票の追加確認は不要です。
          リポジトリのファイルは変更しません。
          外部Webサイト・フィードの取得失敗（403・タイムアウト等、こちらで制御できないもの）はblockedにせず、その項目を「取得不可」としてsummaryにURLと理由を記録し、残りの調査を続けてください。全対象項目の調査または取得不可の記録が完了すればstatusをcompletedとしてよいです。
          調査自体が実施できない場合（調査対象のリポジトリ内ファイルが読めない等）のみblockedにしてください。取得不可の記録でcompletedとしてよいのは、外部Webサイト・フィードの取得失敗だけです。
          summaryには各項目の確認内容、起票候補とした/しなかった判断と理由を記入してください。
          Zenn・Qiitaで過去24時間以内に確認した全記事のURLと1行要約も含めてください。
          issuesは起票候補のみとし、候補がなければ空配列にしてください。
          PROMPT
          )"
          schema='{"type":"object","additionalProperties":false,"properties":{"status":{"type":"string","enum":["completed","blocked"]},"summary":{"type":"string","minLength":1},"issues":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"title":{"type":"string","minLength":1},"body":{"type":"string","minLength":1}},"required":["title","body"]}}},"required":["status","summary","issues"]}'
          exit_code=0
          claude -p "$prompt" \
            --allowedTools "$allowed_tools" \
            --disallowedTools "Edit,Write" \
            --permission-mode dontAsk \
            --model sonnet --effort low \
            --output-format json --json-schema "$schema" \
            > "$diagnostics/response.json" 2> "$diagnostics/stderr.log" || exit_code=$?
          printf '%s\n' "$exit_code" > "$diagnostics/exit-code.txt"
          if [ "$exit_code" -ne 0 ] || ! jq -e -s '
            length == 1 and (.[0] | type == "object" and .type == "result" and .subtype == "success" and .is_error == false
            and (.structured_output | type == "object"
              and .status == "completed"
              and (.summary | type == "string" and test("\\S"))
              and (.issues | type == "array"
                and all(.[]; type == "object"
                  and (.title | type == "string" and length > 0 and length <= 200 and (test("[\\x00-\\x1f]") | not))
                  and (.body | type == "string" and length > 0)))))
          ' "$diagnostics/response.json" > /dev/null; then
            printf '# 夜間調査: 未完了\n\nCLI終了コード: %s。エラー・結果欠落・未完了の有無は診断Artifactを確認してください。\n\n起票件数: 0（調査が完了しなかったため起票していません）。\n' "$exit_code" > "$diagnostics/summary.md"
            echo "::error::Nightly investigation did not complete successfully"
            exit 1
          fi
          jq -r '.structured_output | "# 夜間調査: 完了\n\n起票予定件数: \(.issues | length)（起票結果は「起票Issue」を参照）\n\n\(.summary)\n"' \
            "$diagnostics/response.json" > "$diagnostics/summary.md"

      - name: Create improvement issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          diagnostics="$RUNNER_TEMP/nightly-todo"
          response="$diagnostics/response.json"
          urls="$diagnostics/issue-urls.txt"
          failures="$diagnostics/issue-failures.txt"
          body_file="$diagnostics/issue-body.md"
          : > "$urls"
          : > "$failures"
          touch "$diagnostics/issues-started"
          failed=0
          while IFS= read -r item; do
            title="$(jq -r '.title' <<< "$item")"
            jq -r '.body' <<< "$item" > "$body_file"
            if url="$(gh issue create --repo ai-kurou/KoDriver --title "$title" --body-file "$body_file")"; then
              printf '%s\n' "$url" >> "$urls"
            else
              failed=1
              printf '%s\n' "$title" >> "$failures"
              echo "::error::Failed to create issue: $title"
            fi
          done < <(jq -c '.structured_output.issues[]' "$response")
          rm -f "$body_file"
          exit "$failed"

      - name: Append issue creation results to summary
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/nightly-todo"
          if [ ! -f "$diagnostics/issues-started" ] || [ ! -f "$diagnostics/summary.md" ]; then
            exit 0
          fi
          urls="$diagnostics/issue-urls.txt"
          failures="$diagnostics/issue-failures.txt"
          created="$(wc -l < "$urls" | tr -d ' ')"
          {
            printf '\n## 起票Issue\n\n起票件数: %s\n\n' "$created"
            if [ -s "$urls" ]; then cat "$urls"; else printf 'なし\n'; fi
            if [ -s "$failures" ]; then
              printf '\n起票に失敗したものがあります（ジョブログを確認してください）:\n\n'
              sed 's/^/- /' "$failures"
            fi
          } >> "$diagnostics/summary.md"

      - name: Verify no repository files changed
        if: always()
        run: |
          changed_files="$(git status --porcelain | awk '{print $2}')"
          if [ -n "$changed_files" ]; then
            echo "::error::Unexpected files changed by Claude Code: $changed_files"
            git checkout -- .
            exit 1
          fi

      - name: Publish job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nightly-todo/summary.md" ]; then
            cat "$RUNNER_TEMP/nightly-todo/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "夜間調査: 未完了。調査開始前に失敗した可能性があります。各ステップのログを確認してください。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload nightly diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-todo-diagnostics
          path: ${{ runner.temp }}/nightly-todo/
          if-no-files-found: warn
          retention-days: 7
