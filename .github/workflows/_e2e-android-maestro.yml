name: _E2E Android Maestro

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'テスト対象のブランチ・タグ・コミットSHA'
        type: string
        required: true
        default: main
  workflow_call:
    inputs:
      ref:
        description: 'テスト対象のブランチ・タグ・コミットSHA'
        type: string
        required: true
    secrets:
      KEYSTORE_BASE64:
        required: true
      STORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

jobs:
  build:
    uses: ./.github/workflows/_build-android-release.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  maestro-test:
    needs: build
    name: maestro-test (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # latest: 最新の API レベル、min-sdk: gradle/libs.versions.toml の android-minSdk
        target: [latest, min-sdk]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve minSdk
        id: min-sdk
        if: matrix.target == 'min-sdk'
        uses: ./.github/actions/resolve-min-sdk

      - name: Resolve emulator API level
        id: api
        env:
          TARGET: ${{ matrix.target }}
          MIN_SDK_LEVEL: ${{ steps.min-sdk.outputs.level }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "min-sdk" ]; then
            level="$MIN_SDK_LEVEL"
          else
            level=36
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KoDriver-android-${{ needs.build.outputs.version }}
          path: apk/

      - name: Install Maestro
        env:
          # 更新手順: 新バージョンの zip の SHA256 を `curl -sL <zipのURL> | shasum -a 256` で取得し、下記2値を更新する
          # （URL: https://github.com/mobile-dev-inc/maestro/releases/download/cli-<バージョン>/maestro.zip）
          MAESTRO_VERSION: "2.12.1"
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -rf "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/enable-kvm

      - name: Run Maestro flow on Android emulator
        id: maestro
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        continue-on-error: true # エミュレーターのダウンロード・起動失敗等の一時的な障害に備え、失敗時は1回だけ再実行する
        with:
          api-level: ${{ steps.api.outputs.level }}
          target: google_apis
          arch: x86_64
          profile: pixel_9
          script: |
            .github/scripts/run-maestro-with-artifacts.sh "apk/KoDriver-android-${{ needs.build.outputs.version }}.apk"

      - name: Upload first-attempt Maestro debug artifacts
        if: always() && steps.maestro.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-debug-artifacts-attempt1-${{ matrix.target }}
          path: maestro-artifacts/
          if-no-files-found: ignore

      - name: Retry Maestro flow on Android emulator
        if: steps.maestro.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ steps.api.outputs.level }}
          target: google_apis
          arch: x86_64
          profile: pixel_9
          script: |
            .github/scripts/run-maestro-with-artifacts.sh "apk/KoDriver-android-${{ needs.build.outputs.version }}.apk"

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-debug-artifacts-${{ matrix.target }}
          path: maestro-artifacts/
          if-no-files-found: ignore
