name: _E2E Android Maestro

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'テスト対象のブランチ・タグ・コミットSHA'
        type: string
        required: true
        default: main
  workflow_call:
    inputs:
      ref:
        description: 'テスト対象のブランチ・タグ・コミットSHA'
        type: string
        required: true
    secrets:
      KEYSTORE_BASE64:
        required: true
      STORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

jobs:
  build:
    uses: ./.github/workflows/_build-android-release.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  maestro-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: KoDriver-android-${{ needs.build.outputs.version }}
          path: apk/

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flow on Android emulator
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install "apk/KoDriver-android-${{ needs.build.outputs.version }}.apk"
            mkdir -p maestro-artifacts
            set +e
            maestro test .maestro/tap-bottom-tabs.yaml
            MAESTRO_EXIT_CODE=$?
            set -e
            cp -R "$HOME/.maestro/tests" maestro-artifacts/maestro-tests || true
            adb logcat -d > maestro-artifacts/logcat.txt || true
            adb shell pidof kurou.kodriver > maestro-artifacts/pidof-kodriver.txt || true
            adb shell dumpsys window > maestro-artifacts/dumpsys-window.txt || true
            adb exec-out screencap -p > maestro-artifacts/final-screen.png || true
            exit "$MAESTRO_EXIT_CODE"

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-debug-artifacts
          path: maestro-artifacts/
          if-no-files-found: ignore
