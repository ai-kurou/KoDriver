name: _E2E Android Maestro

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'テスト対象のブランチ・タグ・コミットSHA'
        type: string
        required: true
        default: main
  workflow_call:
    inputs:
      ref:
        description: 'テスト対象のブランチ・タグ・コミットSHA'
        type: string
        required: true
    secrets:
      KEYSTORE_BASE64:
        required: true
      STORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

jobs:
  build:
    uses: ./.github/workflows/_build-android-release.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  maestro-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KoDriver-android-${{ needs.build.outputs.version }}
          path: apk/

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flow on Android emulator
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            .github/scripts/run-maestro-with-artifacts.sh "apk/KoDriver-android-${{ needs.build.outputs.version }}.apk"

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-debug-artifacts
          path: maestro-artifacts/
          if-no-files-found: ignore
