name: On Main Merge

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  detekt:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew detekt"
      timeoutMinutes: 13

  ktlint:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew ktlintCheck"
      timeoutMinutes: 6

  android-lint:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew :app:androidApp:lintDebug"
      timeoutMinutes: 10

  module-graph-assert:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew assertModuleGraph"
      timeoutMinutes: 5

  unit-test:
    uses: ./.github/workflows/_unit-test.yml
    secrets: inherit

  desktop-screenshot-test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 32

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup-screenshot

      - name: Verify JVM screenshot tests
        run: ./gradlew verifyRoborazziJvmTests

  android-screenshot-test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup-screenshot

      - name: Verify Android screenshot tests
        run: ./gradlew verifyRoborazziAndroidHostTests

  # koverXmlReport はデスクトップの JAR を生成するが、Android の APK は生成しない。
  android-build:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew :app:androidApp:assembleDebug"
      timeoutMinutes: 10

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # Roborazzi のスナップショットファイル名が Windows のパス長上限を超えることがある。
      - run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: ./gradlew :app:desktopApp:jar

  dokka-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 連続マージ時に前回のPagesデプロイが進行中のまま次を作成して失敗するのを防ぐ（実行中は待機し、待機中は最新のみ残る）
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: ./gradlew :dokkaGenerate

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # Pages側が syncing_files のまま進まない場合に備え、既定の10分から20分へ延長する
          timeout: 1200000
