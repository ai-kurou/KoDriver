name: Nightly Implement

on:
  schedule:
    - cron: "37 19 * * *" # JST 4:37 (UTC 19:37)
  workflow_dispatch:

concurrency:
  group: nightly-implement-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issues: ${{ steps.select.outputs.issues }}

    steps:
      - name: Select the oldest claude-implementable issue without a linked PR
        id: select
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 検索演算子 `-linked:pr` は、過去にマージ済み・クローズ済みのPRが
          # 本文で issue 番号に言及しただけ（例: 別issue対応の夜間バッチ修正PRが
          # "Closes #NNNN" 等で偶然言及した場合）でも「linked」と判定してしまい、
          # 該当issueが以後ずっと選択対象から除外され続ける不具合がある
          # （#1286, #1290 で発生）。そのため、この演算子には頼らず、
          # 「現在オープン中のPRが実際にそのissueをクローズする予定か」を
          # GraphQLの closingIssuesReferences で個別に確認する。
          all_issues="$(gh issue list \
            --repo "${{ github.repository }}" \
            --search "is:open label:claude-implementable" \
            --json number,title,url \
            --limit 1000 \
            | jq -c 'sort_by(.number)')"

          blocked_issue_numbers="$(gh api graphql -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, first: 100) {
                  nodes { closingIssuesReferences(first: 20) { nodes { number } } }
                }
              }
            }' -f owner="${{ github.event.repository.owner.login }}" -f name="${{ github.event.repository.name }}" \
            --jq '[.data.repository.pullRequests.nodes[].closingIssuesReferences.nodes[].number] | unique')"

          issues="$(jq -c --argjson blocked "${blocked_issue_numbers}" \
            '[.[] | select(.number as $n | $blocked | index($n) | not)] | .[:1]' \
            <<< "${all_issues}")"
          echo "issues=${issues}" >> "$GITHUB_OUTPUT"
          echo "Selected issues: ${issues}"

  implement:
    needs: select-issues
    if: needs.select-issues.outputs.issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        issue: ${{ fromJson(needs.select-issues.outputs.issues) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache global npm directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-claude-code-2.1.226

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Determine JST date
        id: jst
        run: echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Implement issue with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ matrix.issue.number }}
          ISSUE_TITLE: ${{ matrix.issue.title }}
          ISSUE_URL: ${{ matrix.issue.url }}
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          pre_comment_count="$(gh issue view "${ISSUE_NUMBER}" --repo "${REPO}" --json comments --jq '.comments | length')"
          pre_pr_numbers_json="$(gh pr list --repo "${REPO}" --head "claude/issue-${ISSUE_NUMBER}" --state all --json number --jq '[.[].number]')"
          branch_existed_before="false"
          if git ls-remote --exit-code --heads origin "claude/issue-${ISSUE_NUMBER}" >/dev/null 2>&1; then
            branch_existed_before="true"
          fi

          set +e
          claude -p "$(cat <<PROMPT
          KoDriverリポジトリの夜間バッチ処理として、GitHub issue #${ISSUE_NUMBER}（${ISSUE_URL}）を実装してPRを作成してください。

          1. \`gh issue view ${ISSUE_NUMBER} --repo ${REPO} --json title,body,comments\` でissueの内容（本文・コメント）を確認する。
          2. CLAUDE.md の「実装前」チェックリストに従い、既存実装・依存モジュール・類似コードを確認する。
          3. issueの要件が実装するには曖昧・情報不足だと判断した場合は、コード変更は一切行わず、\`gh issue comment ${ISSUE_NUMBER} --repo ${REPO}\` で「要件が不十分なため保留する」旨と不足している情報を日本語で具体的にコメントし、issueには手を付けずに終了する（ラベルは外さない）。
          4. 実装可能と判断した場合は、\`main\` から \`claude/issue-${ISSUE_NUMBER}\` のようなブランチを作成し実装する。CLAUDE.md のテスト方針・コーディング規約・Git操作ルールに従うこと。ユニットテストが必要な変更には同時にテストを追加・更新する。\`docs/improvement-ideas.md\` への新規追加・既存項目の書き換えは行わない（承認が必要なファイルのため）。ただし、\`docs/improvement-ideas.md\` に今回実装したissueの内容と一致する項目が既に存在する場合に限り、その項目のみを削除してよい（この場合、issue自体がユーザー承認済みの実装依頼であるため、削除に別途ユーザー承認は不要）。削除する場合は、実装本体と同じPRに含め、CLAUDE.md の規定どおり \`docs/resolved-improvement-ideas.md\` に \`- YYYY-MM-DD 一言サマリ（関連PR #番号）\` 形式で1行追記すること。
          5. 実装後、\`./gradlew preSubmitChecks\` を実行する。このコマンドは実行に10分以上かかることがあり、Bashツールの1回の呼び出しでフォアグラウンド実行すると最大タイムアウト（10分）に達して打ち切られる可能性がある。そのため、以下の手順で実行すること。
             - \`(./gradlew preSubmitChecks > /tmp/pre_submit_checks.log 2>&1; echo \$? > /tmp/pre_submit_checks.exit) & disown\` のようにOSレベルのバックグラウンドプロセスとして起動する（Bashツールの \`run_in_background\` パラメータは絶対に使用しないこと。これは無関係な別の仕組みであり、このワークフローの非対話実行では完了通知が届かない）。
             - \`ScheduleWakeup\` や \`Monitor\` など、通知を待つツールは一切使用しない（\`/loop\`や対話セッション専用であり、このワークフローでは機能しない）。
             - 起動後は、\`test -f /tmp/pre_submit_checks.exit\` で完了を確認しつつ、\`sleep 60\` を挟んだ短いフォアグラウンドのBash呼び出しを、\`/tmp/pre_submit_checks.exit\` が作成されるまで繰り返し実行してポーリングする（1回のBash呼び出し自体は短時間で終わるため、10分のタイムアウトには抵触しない）。
             - 完了したら \`/tmp/pre_submit_checks.log\` の内容と \`/tmp/pre_submit_checks.exit\` の終了コードを確認し、成功・失敗を判定する。
             - 成功した場合: わかりやすい日本語のコミットメッセージでコミットし、\`git push -u origin claude/issue-${ISSUE_NUMBER}\` でプッシュし、\`gh pr create --repo ${REPO} --base main --head claude/issue-${ISSUE_NUMBER} --title --body\` でPRを作成する（タイトル・説明は日本語、署名やセッションURLは含めない、本文に \"Closes #${ISSUE_NUMBER}\" を含める）。その後 \`gh issue comment ${ISSUE_NUMBER} --repo ${REPO}\` と \`gh pr comment <PR番号> --repo ${REPO}\` の両方に、実装内容の要約とPRへのリンクを日本語でコメントする。
             - 失敗した場合、または実装を完遂できないと判断した場合: 変更を破棄し（\`git checkout -- .\` 等でクリーンな状態に戻す）、\`gh issue comment ${ISSUE_NUMBER} --repo ${REPO}\` で失敗の理由を日本語で具体的にコメントし、\`gh issue edit ${ISSUE_NUMBER} --repo ${REPO} --remove-label claude-implementable\` でラベルを外す。PRは作成しない。
          6. 最後に、実施した内容（コメントあり/保留/失敗のいずれか）を簡潔に出力する。
          PROMPT
          )" \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash" \
            --permission-mode acceptEdits \
            --model sonnet
          claude_exit=$?
          set -e

          post_pr_numbers_json="$(gh pr list --repo "${REPO}" --head "claude/issue-${ISSUE_NUMBER}" --state all --json number --jq '[.[].number]')"
          new_pr_count="$(jq -n --argjson pre "${pre_pr_numbers_json}" --argjson post "${post_pr_numbers_json}" '($post - $pre) | length')"
          post_comment_count="$(gh issue view "${ISSUE_NUMBER}" --repo "${REPO}" --json comments --jq '.comments | length')"

          # PRも作らず、issueへのコメントも一切残さないまま終了した場合は、
          # claude_exitが0であっても「preSubmitChecks待機中に応答が完了しないまま
          # 処理が終わった」等の無応答での中断とみなし、後始末を行う。
          # pr_countは今回の実行で新規作成されたPRのみを数える（過去に同じブランチ名で
          # close/mergeされたPRが残っていると、それを誤って成功と判定してしまうため）。
          if [ "${new_pr_count:-0}" = "0" ] && [ "${post_comment_count:-0}" = "${pre_comment_count:-0}" ]; then
            echo "::warning::Claude Code CLI produced neither a PR nor an issue comment for issue #${ISSUE_NUMBER} (exit code: ${claude_exit})"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            # gh pr createの前にpushされたリモートブランチが残っていると、次回同じissueに
            # 再度ラベルが付いた際にブランチ作成・pushが衝突するため、今回の実行で新規作成
            # された場合のみ削除する（既存ブランチは残す）。
            if [ "${branch_existed_before}" = "false" ]; then
              git push origin --delete "claude/issue-${ISSUE_NUMBER}" 2>/dev/null || true
            fi
            gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "夜間バッチによる自動実装中に応答が完了しないまま処理が終了したため中断しました（Claude Code CLI exit code: ${claude_exit}）。ラベルを外すので、内容を見直したうえで再度ラベルを付与してください。"
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label claude-implementable
            exit 1
          fi

          if [ "$claude_exit" -ne 0 ]; then
            echo "::warning::Claude Code CLI exited with status ${claude_exit} for issue #${ISSUE_NUMBER}"
            exit "$claude_exit"
          fi
