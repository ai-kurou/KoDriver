name: Nightly Implement

on:
  schedule:
    - cron: "37 19 * * *" # JST 4:37 (UTC 19:37)
  workflow_dispatch:

concurrency:
  group: nightly-implement-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issues: ${{ steps.select.outputs.issues }}

    steps:
      - name: Select the oldest claude-implementable issue without a linked PR
        id: select
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 検索演算子 `-linked:pr` は、過去にマージ済み・クローズ済みのPRが
          # 本文で issue 番号に言及しただけ（例: 別issue対応の夜間バッチ修正PRが
          # "Closes #NNNN" 等で偶然言及した場合）でも「linked」と判定してしまい、
          # 該当issueが以後ずっと選択対象から除外され続ける不具合がある
          # （#1286, #1290 で発生）。そのため、この演算子には頼らず、
          # 「現在オープン中のPRが実際にそのissueをクローズする予定か」を
          # GraphQLの closingIssuesReferences で個別に確認する。
          all_issues="$(gh issue list \
            --repo "${{ github.repository }}" \
            --search "is:open label:claude-implementable" \
            --json number,title,url \
            --limit 1000 \
            | jq -c 'sort_by(.number)')"

          blocked_issue_numbers="$(gh api graphql -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, first: 100) {
                  nodes { closingIssuesReferences(first: 20) { nodes { number } } }
                }
              }
            }' -f owner="${{ github.event.repository.owner.login }}" -f name="${{ github.event.repository.name }}" \
            --jq '[.data.repository.pullRequests.nodes[].closingIssuesReferences.nodes[].number] | unique')"

          issues="$(jq -c --argjson blocked "${blocked_issue_numbers}" \
            '[.[] | select(.number as $n | $blocked | index($n) | not)] | .[:1]' \
            <<< "${all_issues}")"
          echo "issues=${issues}" >> "$GITHUB_OUTPUT"
          echo "Selected issues: ${issues}"

  implement:
    needs: select-issues
    if: needs.select-issues.outputs.issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        issue: ${{ fromJson(needs.select-issues.outputs.issues) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache global npm directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-claude-code-2.1.226

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Determine JST date
        id: jst
        run: echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create working branch
        env:
          ISSUE_NUMBER: ${{ matrix.issue.number }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "claude/issue-${ISSUE_NUMBER}"

      - name: Implement issue with Claude Code
        id: claude_implement
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ matrix.issue.number }}
          ISSUE_TITLE: ${{ matrix.issue.title }}
          ISSUE_URL: ${{ matrix.issue.url }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          pre_comment_count="$(gh issue view "${ISSUE_NUMBER}" --repo "${REPO}" --json comments --jq '.comments | length')"
          echo "pre_comment_count=${pre_comment_count}" >> "$GITHUB_OUTPUT"

          rm -f /tmp/kodriver_status /tmp/kodriver_pr_title.txt /tmp/kodriver_pr_body.txt /tmp/kodriver_commit_message.txt

          set +e
          claude -p "$(cat <<PROMPT
          KoDriverリポジトリの夜間バッチ処理として、GitHub issue #${ISSUE_NUMBER}（${ISSUE_URL}）を実装してください。
          このステップでは実装（コード変更・テスト追加）とPR用文言の下書きまでを行い、\`./gradlew preSubmitChecks\` の実行・コミット・プッシュ・PR作成は行わない（それらは実装完了後、別のワークフローステップが機械的に行う）。

          1. \`gh issue view ${ISSUE_NUMBER} --repo ${REPO} --json title,body,comments\` でissueの内容（本文・コメント）を確認する。
          2. CLAUDE.md の「実装前」チェックリストに従い、既存実装・依存モジュール・類似コードを確認する。
          3. issueの要件が実装するには曖昧・情報不足だと判断した場合は、コード変更は一切行わず、\`gh issue comment ${ISSUE_NUMBER} --repo ${REPO}\` で「要件が不十分なため保留する」旨と不足している情報を日本語で具体的にコメントする。その後 \`echo "insufficient" > /tmp/kodriver_status\` を実行して終了する（issueのラベルは外さない）。
          4. 実装可能と判断した場合は実装する（既に \`claude/issue-${ISSUE_NUMBER}\` ブランチにチェックアウト済みのため、ブランチ作成は不要）。CLAUDE.md のテスト方針・コーディング規約・Git操作ルールに従うこと。ユニットテストが必要な変更には同時にテストを追加・更新する。\`docs/improvement-ideas.md\` への新規追加・既存項目の書き換えは行わない（承認が必要なファイルのため）。ただし、\`docs/improvement-ideas.md\` に今回実装したissueの内容と一致する項目が既に存在する場合に限り、その項目のみを削除してよい（この場合、issue自体がユーザー承認済みの実装依頼であるため、削除に別途ユーザー承認は不要）。削除する場合は、実装本体と同じPRに含め、CLAUDE.md の規定どおり \`docs/resolved-improvement-ideas.md\` に \`- YYYY-MM-DD 一言サマリ（関連PR #番号）\` 形式で1行追記すること。
             実装が完了したら、以下のファイルを作成する（コミット・プッシュ・PR作成・\`preSubmitChecks\`の実行は絶対に行わないこと。後続のワークフローステップが機械的に行うため）。
             - \`/tmp/kodriver_commit_message.txt\`: わかりやすい日本語のコミットメッセージ（1行目に要約、必要なら本文）
             - \`/tmp/kodriver_pr_title.txt\`: 日本語のPRタイトル（1行のみ）
             - \`/tmp/kodriver_pr_body.txt\`: 日本語のPR説明本文（署名やセッションURLは含めない。末尾に \"Closes #${ISSUE_NUMBER}\" を含める）
             - 最後に \`echo "implemented" > /tmp/kodriver_status\` を実行する。
          5. 実装を完遂できないと判断した場合（実装中に解決できない問題に遭遇した等）は、変更を破棄し（\`git checkout -- .\` \`git clean -fd\` 等でクリーンな状態に戻す）、\`gh issue comment ${ISSUE_NUMBER} --repo ${REPO}\` で理由を日本語で具体的にコメントし、\`echo "failed" > /tmp/kodriver_status\` を実行して終了する（ラベルを外す処理は後続のワークフローステップが行う）。
          6. 最後に、実施した内容（実装/保留/失敗のいずれか）を簡潔に出力する。
          PROMPT
          )" \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash" \
            --permission-mode acceptEdits \
            --model sonnet
          claude_exit=$?
          set -e
          echo "claude_exit=${claude_exit}" >> "$GITHUB_OUTPUT"

          status="unknown"
          if [ -f /tmp/kodriver_status ]; then
            status="$(cat /tmp/kodriver_status)"
          fi
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "Claude Code CLI finished with status='${status}' (exit code: ${claude_exit})"

      - name: Handle paused/failed/unknown outcome
        if: steps.claude_implement.outputs.status != 'implemented'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ matrix.issue.number }}
          REPO: ${{ github.repository }}
          STATUS: ${{ steps.claude_implement.outputs.status }}
          CLAUDE_EXIT: ${{ steps.claude_implement.outputs.claude_exit }}
          PRE_COMMENT_COUNT: ${{ steps.claude_implement.outputs.pre_comment_count }}
        run: |
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          # 保留（insufficient）・明示的な失敗（failed）は、Claude自身が既にissueへ
          # コメント済みのはずなので、ここでは何もしない。ラベルは failed のときのみ外す。
          if [ "${STATUS}" = "insufficient" ]; then
            echo "Issue #${ISSUE_NUMBER} was paused by Claude Code CLI (insufficient information)."
            exit 0
          fi

          if [ "${STATUS}" = "failed" ]; then
            echo "::warning::Claude Code CLI could not complete issue #${ISSUE_NUMBER} (reported failure)"
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label claude-implementable
            exit 0
          fi

          # ここに到達するのは status が "implemented"/"insufficient"/"failed" の
          # いずれでもない場合（Claude Code CLI がクラッシュした、ステータスファイルを
          # 書き忘れた等）。コメント・PRのいずれも残さず終了した無応答な中断とみなす。
          post_comment_count="$(gh issue view "${ISSUE_NUMBER}" --repo "${REPO}" --json comments --jq '.comments | length')"
          if [ "${post_comment_count:-0}" != "${PRE_COMMENT_COUNT:-0}" ]; then
            echo "status is unrecognized ('${STATUS}') but a comment was posted; leaving the label as-is."
            exit 0
          fi

          echo "::warning::Claude Code CLI produced neither a PR nor an issue comment for issue #${ISSUE_NUMBER} (status: ${STATUS}, exit code: ${CLAUDE_EXIT})"
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "夜間バッチによる自動実装中に応答が完了しないまま処理が終了したため中断しました（Claude Code CLI exit code: ${CLAUDE_EXIT}）。ラベルを外すので、内容を見直したうえで再度ラベルを付与してください。"
          gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label claude-implementable

      - name: Run preSubmitChecks
        id: presubmit
        if: steps.claude_implement.outputs.status == 'implemented'
        run: |
          set +e
          ./gradlew preSubmitChecks
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Create PR or report preSubmitChecks failure
        if: steps.claude_implement.outputs.status == 'implemented'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ matrix.issue.number }}
          REPO: ${{ github.repository }}
          PRESUBMIT_EXIT_CODE: ${{ steps.presubmit.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch_name="claude/issue-${ISSUE_NUMBER}"

          if [ "${PRESUBMIT_EXIT_CODE}" != "0" ]; then
            echo "::warning::preSubmitChecks failed (exit code: ${PRESUBMIT_EXIT_CODE}) for issue #${ISSUE_NUMBER}"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "夜間バッチによる自動実装後、\`./gradlew preSubmitChecks\` が失敗したため変更を破棄しました（exit code: ${PRESUBMIT_EXIT_CODE}）。詳細はワークフロー実行ログを参照してください: ${RUN_URL}"
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label claude-implementable
            exit 0
          fi

          # モジュール図・スクリーンショット画像はCIで自動更新される仕組みのため、
          # preSubmitChecksの実行中に生成・変更されていてもコミットに含めない。
          git add -A
          mapfile -t excluded_files < <(git diff --cached --name-only | grep -E '(^|/)snapshots/[^/]+\.png$|^docs/graphs/[^/]+\.(gv|svg)$' || true)
          if [ "${#excluded_files[@]}" -gt 0 ]; then
            git reset -- "${excluded_files[@]}"
          fi

          if git diff --cached --quiet; then
            echo "::warning::No staged changes after excluding generated files for issue #${ISSUE_NUMBER}"
            gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "夜間バッチによる自動実装後、コミット対象の変更が見つかりませんでした。ラベルを外すので、内容を見直したうえで再度ラベルを付与してください。"
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --remove-label claude-implementable
            exit 0
          fi

          git commit -F /tmp/kodriver_commit_message.txt
          git push -u origin "${branch_name}"

          pr_url="$(gh pr create --repo "${REPO}" --base main --head "${branch_name}" --title "$(cat /tmp/kodriver_pr_title.txt)" --body-file /tmp/kodriver_pr_body.txt)"
          pr_number="${pr_url##*/}"

          gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "夜間バッチにより実装し、PRを作成しました: ${pr_url}"
          gh pr comment "${pr_number}" --repo "${REPO}" --body "夜間バッチにより実装しました。issue #${ISSUE_NUMBER} を参照してください。"
