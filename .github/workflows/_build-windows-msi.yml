name: _Build Windows MSI

on:
  workflow_call:
    inputs:
      ref:
        description: 'ビルド対象のブランチ・タグ・コミットSHA'
        type: string
        required: true
    outputs:
      version:
        description: 'gradle.properties の appVersion'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Roborazzi のスナップショットファイル名が Windows のパス長上限を超えることがある。
      - run: git config --global core.longpaths true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(grep '^appVersion=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Build MSI
        run: ./gradlew :app:desktopApp:packageMsi

      - name: Rename MSI
        shell: bash
        run: |
          mv app/desktopApp/build/compose/binaries/main/msi/*.msi \
             app/desktopApp/build/compose/binaries/main/msi/KoDriver-windows-${{ steps.version.outputs.version }}.msi

      - name: Upload MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KoDriver-windows-${{ steps.version.outputs.version }}
          path: app/desktopApp/build/compose/binaries/main/msi/KoDriver-windows-${{ steps.version.outputs.version }}.msi
          retention-days: 30
