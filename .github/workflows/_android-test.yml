name: _Android Test

on:
  workflow_call:
    inputs:
      api-level:
        description: 'テストを実行するエミュレーターの API レベル'
        type: number
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ inputs.api-level }}-pixel_9-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        continue-on-error: true # スナップショット生成は高速化のためだけのため、失敗してもテスト本体（AVDは未作成なら自動作成）に進む
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          profile: pixel_9
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - id: emulator-test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        continue-on-error: true # システムイメージのダウンロード失敗等の一時的な障害に備え、失敗時は1回だけ再実行する
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          profile: pixel_9
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload first-attempt test report
        if: always() && steps.emulator-test.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-report-api-${{ inputs.api-level }}-attempt1
          path: app/androidApp/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Retry emulator test
        id: emulator-test-retry
        if: steps.emulator-test.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          profile: pixel_9
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload test report
        if: always() && steps.emulator-test-retry.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-report-api-${{ inputs.api-level }}
          path: app/androidApp/build/reports/androidTests/connected/
          if-no-files-found: ignore
