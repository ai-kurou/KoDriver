name: _Android Test

on:
  workflow_call:
    inputs:
      api-level:
        description: 'テストを実行するエミュレーターの API レベル'
        type: number
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/enable-kvm

      - id: emulator-test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        continue-on-error: true # システムイメージのダウンロード失敗等の一時的な障害に備え、失敗時は1回だけ再実行する
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          profile: pixel_9
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload first-attempt test report
        if: always() && steps.emulator-test.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-report-api-${{ inputs.api-level }}-attempt1
          path: app/androidApp/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Retry emulator test
        id: emulator-test-retry
        if: steps.emulator-test.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          profile: pixel_9
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload test report
        if: always() && steps.emulator-test-retry.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-report-api-${{ inputs.api-level }}
          path: app/androidApp/build/reports/androidTests/connected/
          if-no-files-found: ignore
