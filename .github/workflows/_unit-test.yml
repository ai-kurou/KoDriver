name: _Unit Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    # PR ではビルドキャッシュのミス量で所要時間が 1〜28 分と大きく変動するため、余裕を持たせて 40 分とする
    timeout-minutes: 40
    # 再利用ワークフローのジョブIDはすべて run のため、unit-test 専用のキャッシュ枠を分けて他ジョブとの取り合いを防ぐ
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: unit-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # ワーカー数・ヒープは .github/actions/setup が CI 用に上書きする（gradle.properties はローカル向け）
      # スクリーンショットテストは *-screenshot-test-verify ジョブで実行するため除外する
      - run: ./gradlew koverXmlReport -PexcludeScreenshotTests=true

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml

      # テストが失敗した場合のみ、失敗詳細を含む JUnit XML を成果物として残す（flaky テストの原因調査用）
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: "**/build/test-results/**/*.xml"
          retention-days: 7
          if-no-files-found: ignore
