name: On Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン番号 (例: 1.2.0)'
        required: true

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set-version.outputs.version }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set version
        id: set-version
        run: |
          echo "VERSION_NAME=$INPUT_VERSION" >> $GITHUB_ENV
          echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Update appVersion in gradle.properties
        run: sed -i "s/^appVersion=.*/appVersion=$VERSION_NAME/" gradle.properties

      - name: Increment androidVersionCode in gradle.properties
        run: |
          CURRENT=$(grep "^androidVersionCode=" gradle.properties | cut -d= -f2)
          NEW_CODE=$((CURRENT + 1))
          sed -i "s/^androidVersionCode=.*/androidVersionCode=$NEW_CODE/" gradle.properties

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to $VERSION_NAME [skip ci]"
          git push origin main

  build-msi:
    needs: version-bump
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build MSI
        run: ./gradlew :app:desktopApp:packageMsi

      - name: Rename MSI
        shell: bash
        env:
          VERSION_NAME: ${{ needs.version-bump.outputs.version }}
        run: |
          mv app/desktopApp/build/compose/binaries/main/msi/KoDriver-${VERSION_NAME}.msi \
             app/desktopApp/build/compose/binaries/main/msi/KoDriver-windows-${VERSION_NAME}.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi
          path: app/desktopApp/build/compose/binaries/main/msi/KoDriver-windows-${{ needs.version-bump.outputs.version }}.msi

  build-apk:
    needs: version-bump
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/androidApp/kodriver.jks

      - name: Build APK
        env:
          STORE_FILE: app/androidApp/kodriver.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:androidApp:assembleRelease

      - name: Rename APK
        env:
          VERSION_NAME: ${{ needs.version-bump.outputs.version }}
        run: |
          mv app/androidApp/build/outputs/apk/release/KoDriver-android-${VERSION_NAME}-release.apk \
             app/androidApp/build/outputs/apk/release/KoDriver-android-${VERSION_NAME}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: app/androidApp/build/outputs/apk/release/KoDriver-android-${{ needs.version-bump.outputs.version }}.apk

  create-release:
    needs: [version-bump, build-msi, build-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msi
          path: artifacts/

      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.version-bump.outputs.version }}
        run: |
          gh release create "v$VERSION_NAME" \
            --repo ai-kurou/KoDriver \
            --title "Release v$VERSION_NAME" \
            --generate-notes \
            artifacts/KoDriver-windows-${VERSION_NAME}.msi \
            artifacts/KoDriver-android-${VERSION_NAME}.apk
