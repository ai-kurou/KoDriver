name: _Screenshot Test Verify

on:
  workflow_call:
    inputs:
      taskSuffix:
        description: 'Roborazzi の verify/record タスク名のサフィックス（例: Jvm, AndroidHost）'
        type: string
        required: true
      snapshotPathGlob:
        description: 'golden 画像の find -path パターン（例: */jvmTest/snapshots/*.png）'
        type: string
        required: true
      timeoutMinutes:
        type: number
        required: true
    secrets:
      GH_PAT:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeoutMinutes }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-screenshot

      - name: Verify screenshot tests
        id: verify
        continue-on-error: true
        # --continue を付けないと、いずれかのモジュールの検証が失敗した時点で
        # Gradle が以降の未実行タスクのスケジューリングを止めてしまい、他のモジュールの
        # スクリーンショット差分が実行されないまま見逃されることがある（#1395）。
        # gradle.properties の workers.max=2 はローカルのメモリ節約用。CI（4 vCPU）では 4 に上書きして短縮する
        # 失敗したモジュールだけを record するため、Gradle の出力をログに残す
        run: |
          set -o pipefail
          ./gradlew verifyRoborazzi${{ inputs.taskSuffix }}Tests --continue -Dorg.gradle.workers.max=4 2>&1 | tee verify.log

      - name: Record golden images
        if: steps.verify.outcome == 'failure'
        # record タスク自体が失敗（コンパイルエラー等）しても、後続の commit ステップで
        # 正常に記録できたモジュール分の golden 画像だけはコミットできるようにする。
        continue-on-error: true
        env:
          TASK_SUFFIX: ${{ inputs.taskSuffix }}
        run: |
          # verify が失敗したモジュールのテストタスクだけを record し、全モジュールの再実行を避ける
          failed=$(grep -oE '^> Task (:[^ ]+):(jvmTest|testAndroidHostTest) FAILED' verify.log | awk '{print $3}' | sed -E 's/:(jvmTest|testAndroidHostTest)$//' | sort -u)
          if [ -z "$failed" ]; then
            # 失敗モジュールを特定できない場合（コンパイルエラー等）は従来どおり全体を record する
            ./gradlew "recordRoborazzi${TASK_SUFFIX}Tests" --continue -Dorg.gradle.workers.max=4
          else
            tasks=()
            for m in $failed; do tasks+=("${m}:recordRoborazzi${TASK_SUFFIX}Test"); done
            ./gradlew "${tasks[@]}" --continue -Dorg.gradle.workers.max=4
          fi

      - name: Commit updated golden images
        if: steps.verify.outcome == 'failure'
        env:
          TARGET_REF: ${{ github.head_ref }}
          SNAPSHOT_PATH_GLOB: ${{ inputs.snapshotPathGlob }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . -path "$SNAPSHOT_PATH_GLOB" -not -path "*/build/*" -print0 | xargs -0 -r git add
          if git diff --staged --quiet; then
            echo "No golden image changes to commit"
          else
            git commit -m "chore: update golden images"
            for attempt in 1 2 3; do
              git pull --rebase origin "$TARGET_REF"
              git push origin "HEAD:$TARGET_REF" && break
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Fail when golden images were stale
        if: steps.verify.outcome == 'failure'
        run: exit 1
