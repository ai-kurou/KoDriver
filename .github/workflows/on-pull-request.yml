name: On Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: ./gradlew :app:androidApp:lintDebug

  module-graph-assert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: ./gradlew assertModuleGraph

  update-module-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: module-graph-assert
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Generate module graph images
        run: ./gradlew generateModuleGraphImages

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/graphs/ README.md 2>/dev/null || true
          find . -name "README.md" \
            -not -path "*/build/*" -not -path "*/.git/*" | xargs -r git add
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update module graph images"
            git push
          fi

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: ./gradlew detekt

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: ./gradlew koverXmlReport

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml

  desktop-screenshot-test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-screenshot

      - name: Verify JVM screenshot tests
        id: verify
        continue-on-error: true
        run: ./gradlew verifyRoborazziJvmTests

      - name: Record JVM golden images
        if: steps.verify.outcome == 'failure'
        run: ./gradlew recordRoborazziJvmTests

      - name: Commit updated JVM golden images
        if: steps.verify.outcome == 'failure'
        env:
          TARGET_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . -path "*/jvmTest/snapshots/*.png" -not -path "*/build/*" -print0 | xargs -0 -r git add
          if git diff --staged --quiet; then
            echo "No JVM golden image changes to commit"
          else
            git commit -m "chore: update golden images"
            for attempt in 1 2 3; do
              git pull --rebase origin "$TARGET_REF"
              git push origin "HEAD:$TARGET_REF" && break
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Fail when JVM golden images were stale
        if: steps.verify.outcome == 'failure'
        run: exit 1

  android-screenshot-test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-screenshot

      - name: Verify Android screenshot tests
        id: verify
        continue-on-error: true
        run: ./gradlew verifyRoborazziAndroidHostTests

      - name: Record Android golden images
        if: steps.verify.outcome == 'failure'
        run: ./gradlew recordRoborazziAndroidHostTests

      - name: Commit updated Android golden images
        if: steps.verify.outcome == 'failure'
        env:
          TARGET_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . -path "*/androidHostTest/snapshots/*.png" -not -path "*/build/*" -print0 | xargs -0 -r git add
          if git diff --staged --quiet; then
            echo "No Android golden image changes to commit"
          else
            git commit -m "chore: update golden images"
            for attempt in 1 2 3; do
              git pull --rebase origin "$TARGET_REF"
              git push origin "HEAD:$TARGET_REF" && break
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Fail when Android golden images were stale
        if: steps.verify.outcome == 'failure'
        run: exit 1

  desktop-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: ./gradlew :app:desktopApp:test

  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 11

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest

  android-maestro-e2e:
    uses: ./.github/workflows/_e2e-android-maestro.yml
    with:
      ref: ${{ github.head_ref }}
    secrets: inherit
