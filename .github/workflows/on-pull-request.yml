name: On Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-lint:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew :app:androidApp:lintDebug"
      timeoutMinutes: 10

  module-graph-assert:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew assertModuleGraph"
      timeoutMinutes: 5

  update-module-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: module-graph-assert
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Generate module graph images
        run: ./gradlew generateModuleGraphImages

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/graphs/ README.md 2>/dev/null || true
          find . -name "README.md" \
            -not -path "*/build/*" -not -path "*/.git/*" | xargs -r git add
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update module graph images"
            git push
          fi

  detekt:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew detekt"
      timeoutMinutes: 13

  ktlint:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew ktlintCheck"
      timeoutMinutes: 6

  unit-test:
    uses: ./.github/workflows/_unit-test.yml
    secrets: inherit

  desktop-screenshot-test-verify:
    permissions:
      contents: write
    uses: ./.github/workflows/_screenshot-test-verify.yml
    with:
      taskSuffix: Jvm
      snapshotPathGlob: "*/jvmTest/snapshots/*.png"
      timeoutMinutes: 45
    secrets: inherit

  android-screenshot-test-verify:
    permissions:
      contents: write
    uses: ./.github/workflows/_screenshot-test-verify.yml
    with:
      taskSuffix: AndroidHost
      snapshotPathGlob: "*/androidHostTest/snapshots/*.png"
      timeoutMinutes: 35
    secrets: inherit

  desktop-test:
    uses: ./.github/workflows/_gradle-check.yml
    with:
      command: "./gradlew :app:desktopApp:test"
      timeoutMinutes: 6

  android-test:
    uses: ./.github/workflows/_android-test.yml
    with:
      api-level: 36

  # gradle/libs.versions.toml の android-minSdk と同じ値にする
  android-test-min-sdk:
    uses: ./.github/workflows/_android-test.yml
    with:
      api-level: 28

  android-maestro-e2e:
    uses: ./.github/workflows/_e2e-android-maestro.yml
    with:
      ref: ${{ github.head_ref }}
    secrets: inherit

  codeql-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/codeql-analyze
