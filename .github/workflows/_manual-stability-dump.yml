name: Manual Stability Dump

on:
  workflow_dispatch:
    inputs:
      module:
        description: "stabilityDump対象モジュール（例: app:shared）"
        required: true

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run stabilityDump
        run: ./gradlew ":${{ inputs.module }}:stabilityDump"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stability-dump
          path: "**/stability/*.stability"
          retention-days: 1
