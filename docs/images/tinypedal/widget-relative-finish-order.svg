<text x="255.0" y="44" font-size="10" fill="#7c848c" text-anchor="middle" font-weight="normal">YOU</text>
<text x="30" y="68" font-size="11" fill="#9aa0a6" text-anchor="start" font-weight="normal">FINISH</text>
<text x="160" y="68" font-size="14" fill="#e8e8e8" text-anchor="middle" font-weight="normal">0.10</text>
<text x="254" y="68" font-size="14" fill="#fbc02d" text-anchor="middle" font-weight="bold">0.90</text>
