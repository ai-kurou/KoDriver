<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" font-family="sans-serif">
<rect x="0" y="0" width="320" height="140" rx="6" fill="#16181d"/>
<text x="160" y="22" font-size="11" fill="#9aa0a6" text-anchor="middle" font-weight="normal">リーダーと自車の推定フィニッシュ進行位置</text>
<text x="67.0" y="44" font-size="10" fill="#7c848c" text-anchor="middle" font-weight="normal"></text>
