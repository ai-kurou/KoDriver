#Kotlin
kotlin.code.style=official
# Compile in-process to reduce memory usage without a separate Kotlin daemon
kotlin.compiler.execution.strategy=in-process

#Gradle
# Limit the Gradle heap to 2GB to reduce memory usage
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
# Limit concurrent workers to reduce memory usage from test worker JVMs
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Application
appVersion=4.1.0
androidVersionCode=30

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
